<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>숫자 야구 게임</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .game {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 25px 0;
        }

        input {
            width: 180px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .history {
            margin-top: 25px;
            text-align: left;
        }

        .result {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .correct {
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>⚾ 숫자 야구 게임</h1>

    <p>4자리 숫자를 입력하세요</p>

    {% if not game_over %}

    <form method="POST">

        <div class="input-box">

            <input
                type="number"
                name="answer"
                placeholder="숫자 입력"
                required
            >

            <button type="submit">확인</button>

        </div>

    </form>

    {% else %}

    <p class="correct">🎉 정답입니다!</p>

    {% endif %}


    <div class="history">

        {% for result in history %}

            <div class="result">
                {{ result }}
            </div>

        {% endfor %}

    </div>

</div>
